[package]
name = "kassee-protected-vault-consensus-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "../src/kspt_protected_vault_consensus_tests.rs"

[dependencies]
kassee-web = { path = "..", features = ["protected-vault-verification"] }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "98a4ccd8d200853787f227bd4536ac540cf34957" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
serde_json = "1"
hex = "0.4"
